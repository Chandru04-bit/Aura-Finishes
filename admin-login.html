<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login &bull; Aura Finishes &amp; Co.</title>
  <meta name="description" content="Secure administrative access for Aura Finishes & Co. atelier and project management.">
  
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dark-mode.css">

  <!-- Immediate Theme Initialization to Prevent FOIT -->
  <script>
    (function() {
      var saved = localStorage.getItem('aura_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
</head>
<body class="admin-body d-flex flex-column min-vh-100 justify-content-between">

  <!-- Minimal Header Bar -->
  <header class="py-3 px-4 bg-surface border-bottom border-subtle d-flex align-items-center justify-content-between">
    <a class="navbar-brand d-inline-flex align-items-center" href="index.html">
      <div class="brand-icon-wrapper me-2">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <div>
        <span class="brand-main">Aura</span><span class="brand-sub">Admin</span>
      </div>
    </a>
    <div class="d-flex align-items-center gap-2">
      <button class="mode-toggle" type="button" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
      <a href="index.html" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1">
        <i class="bi bi-arrow-left"></i> Public Website
      </a>
    </div>
  </header>

  <!-- Main Login Card -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container d-flex justify-content-center">
      <div class="auth-container" style="max-width: 440px; width: 100%;">
        <div class="auth-card-compact bg-surface p-4 p-md-5 rounded-4 border border-subtle shadow-lg">
          
          <div class="text-center mb-4">
            <div class="admin-brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
              <i class="bi bi-shield-shaded"></i>
            </div>
            <h1 class="fw-bold fs-4 mb-1 text-heading">Administrator Portal</h1>
            <p class="text-muted small mb-0">Authorized personnel only &bull; Encrypted access</p>
          </div>

          <div id="adminLoginAlert" class="alert alert-danger py-2 small d-none" role="alert">
            <i class="bi bi-exclamation-circle-fill me-1"></i> <span id="adminLoginAlertText">Invalid credentials.</span>
          </div>

          <form id="adminLoginForm">
            <div class="form-group-compact mb-3">
              <label class="form-label small fw-bold text-heading">Admin Email or Username</label>
              <div class="input-group">
                <span class="input-group-text bg-surface-soft border-subtle text-muted"><i class="bi bi-person"></i></span>
                <input type="text" id="adminEmailInput" class="form-control" required placeholder="admin@aurafinishes.com" value="admin@aurafinishes.com">
              </div>
            </div>

            <div class="form-group-compact mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label small fw-bold text-heading mb-0">Secret Key / Password</label>
              </div>
              <div class="password-input-group input-group">
                <span class="input-group-text bg-surface-soft border-subtle text-muted"><i class="bi bi-key"></i></span>
                <input type="password" id="adminPasswordInput" name="password" class="form-control" required placeholder="••••••••" value="admin123">
                <button class="password-toggle-btn btn btn-outline-secondary" type="button" aria-label="Toggle password visibility">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="adminRememberMe" checked>
              <label class="form-check-label small text-muted" for="adminRememberMe">
                Keep administrator session active
              </label>
            </div>

            <button type="submit" class="btn btn-primary btn-submit-compact w-100 py-2 fw-bold d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-shield-check"></i> Authenticate &amp; Access Dashboard
            </button>

            <!-- Quick Demo Credentials Notice -->
            <div class="mt-4 p-3 bg-surface-soft rounded-3 border border-subtle text-center">
              <div class="small fw-bold text-heading mb-1"><i class="bi bi-info-circle text-primary me-1"></i> Default Demo Credentials:</div>
              <div class="small text-muted font-monospace">Email: <strong class="text-heading">admin@aurafinishes.com</strong></div>
              <div class="small text-muted font-monospace">Password: <strong class="text-heading">admin123</strong></div>
            </div>

            <!-- Return to Client Portal Link -->
            <div class="text-center mt-3 pt-3 border-top border-subtle">
              <a href="/signin" class="small text-muted text-decoration-none d-inline-flex align-items-center gap-1 hover-primary">
                <i class="bi bi-person-lock text-primary"></i> Looking for client portal? <span class="fw-bold text-primary">Client Login</span>
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 bg-surface border-top border-subtle text-center text-muted small">
    &copy; 2026 Aura Finishes &amp; Co. &bull; Internal Management System
  </footer>

  <!-- Scripts -->
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
