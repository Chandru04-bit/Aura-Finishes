<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Sign In — Aura Finishes &amp; Co.</title>
  <link rel="icon" type="image/svg+xml" href="images/logo/favicon.svg">
  <meta name="description" content="Secure Client Portal &amp; Account Management — Aura Finishes &amp; Co.">
  <!-- Preconnect & CDNs -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Master Theme Styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="stylesheet" href="css/rtl.css">
</head>
<body class="auth-standalone-page">
  <!-- Floating Dark/Light & Direction Controls -->
  <div class="auth-theme-controls">
    <button class="mode-toggle" type="button" title="Toggle Dark/Light Mode" aria-label="Toggle Dark Theme">
      <i class="bi bi-moon-stars-fill"></i>
    </button>
    <button class="rtl-toggle" type="button" title="Toggle RTL Text Direction" aria-label="Toggle RTL Direction">
      <i class="bi bi-text-right"></i>
    </button>
  </div>

  <!-- Auth Main Content (Centered Form Card) -->
  <main class="auth-main-wrapper flex-grow-1 d-flex align-items-center justify-content-center py-4 px-3">
    <div class="auth-container">
      <div class="auth-card-compact">
        <div class="text-center mb-3">
          <div class="auth-icon-badge">
            <i class="bi bi-person-lock"></i>
          </div>
          <h1 class="fw-bold fs-4 mb-1">Portal Login</h1>
          <p class="text-muted small mb-0">View daily logs, sample approvals &amp; timelines.</p>
        </div>

        
        <div id="clientLoginAlert" class="alert alert-danger py-2 small d-none" role="alert">
          <i class="bi bi-exclamation-circle-fill me-1"></i> <span id="clientLoginAlertText">Invalid credentials.</span>
        </div>

        <form data-validate="true" data-form-type="Client Portal Login" id="clientLoginForm">
          <div class="form-group-compact">
            <label class="form-label">Email or Username</label>
            <input type="text" class="form-control" name="loginIdentifier" id="clientLoginIdentifier" required placeholder="client@example.com or name">
          </div>

          <div class="form-group-compact">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label mb-0">Password</label>
              <a href="forgot-password.html" class="small text-primary text-decoration-none" style="font-size: 0.8125rem;">Forgot?</a>
            </div>
            <div class="password-input-group input-group">
              <input type="password" name="password" id="clientLoginPassword" class="form-control" required placeholder="••••••••">
              <button class="password-toggle-btn" type="button" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label" for="rememberMe">
              Keep me signed in for 30 days
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-submit-compact">
            <i class="bi bi-box-arrow-in-right"></i> Sign In to Portal
          </button>

          <div class="auth-divider">
            <span>or continue with</span>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <button type="button" class="social-auth-btn">
                <i class="bi bi-google"></i> Google
              </button>
            </div>
            <div class="col-6">
              <button type="button" class="social-auth-btn">
                <i class="bi bi-apple"></i> Apple
              </button>
            </div>
          </div>

          <div class="text-center small text-muted">
            Don’t have an account? <a href="register.html" class="fw-bold text-primary text-decoration-none">Create an account</a>
          </div>
        </form>

      </div>
    </div>
  </main>

  <!-- Standalone Minimal Footer -->
  <footer class="auth-standalone-footer">
    <div class="container">
      &copy; 2026 Aura Finishes &amp; Co. &bull; Secure Encrypted Client Portal
    </div>
  </footer>

  <!-- Bootstrap 5 JS Bundle & Main Script -->
  <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
