<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Aura Finishes &amp; Co.</title>
  <link rel="icon" type="image/svg+xml" href="images/logo/favicon.svg">
  <meta name="description" content="Secure Client Portal &amp; Account Management — Aura Finishes &amp; Co.">
  <!-- Preconnect & CDNs -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Master Theme Styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="stylesheet" href="css/rtl.css">
</head>
<body class="auth-standalone-page">
  <!-- Standalone Header Topbar -->
  <header class="auth-topbar">
    <a href="index.html" class="auth-brand" aria-label="Aura Finishes Home">
      <div class="brand-icon-wrapper me-2"><i class="bi bi-brush-fill"></i></div>
      <div class="brand-text-group"><span class="brand-main">Aura</span><span class="brand-sub">Finishes</span></div>
    </a>

    <div class="d-flex align-items-center gap-2">
      <button class="mode-toggle" type="button" title="Toggle Dark/Light Mode" aria-label="Toggle Dark Theme">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
      <button class="rtl-toggle" type="button" title="Toggle RTL Text Direction" aria-label="Toggle RTL Direction">
        <i class="bi bi-text-right"></i>
      </button>
      <a href="index.html" class="btn btn-outline-dark btn-sm d-none d-sm-inline-flex align-items-center">
        <i class="bi bi-arrow-left me-1"></i> Back to Website
      </a>
    </div>
  </header>

  <!-- Auth Main Content (Centered Form Card) -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-4 px-3">
    <div class="auth-container">
      <div class="auth-card-compact">
        <div class="text-center mb-3">
          <div class="auth-icon-badge">
            <i class="bi bi-shield-lock-fill"></i>
          </div>
          <h1 class="fw-bold fs-4 mb-1">Set New Password</h1>
          <p class="text-muted small mb-0">Create a new secure password for your client portal account.</p>
        </div>

        
        <div id="resetPasswordSuccess" class="alert alert-success py-2 small d-none" role="alert">
          <i class="bi bi-check-circle-fill me-1"></i> Password successfully updated! Redirecting to sign in...
        </div>

        <form data-validate="true" data-form-type="Password Reset Submission" id="resetPasswordForm">
          <div class="form-group-compact">
            <label class="form-label">New Password</label>
            <div class="password-input-group input-group">
              <input type="password" name="new_password" id="newPasswordInput" class="form-control" required placeholder="Minimum 6 characters" minlength="6">
              <button class="password-toggle-btn" type="button" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-group-compact mb-3">
            <label class="form-label">Confirm New Password</label>
            <div class="password-input-group input-group">
              <input type="password" name="confirm_new_password" id="confirmNewPasswordInput" class="form-control" required placeholder="Re-type password" minlength="6">
              <button class="password-toggle-btn" type="button" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-submit-compact">
            <i class="bi bi-shield-check"></i> Update Password &amp; Sign In
          </button>

          <div class="text-center small text-muted mt-3">
            Back to <a href="signin.html" class="fw-bold text-primary text-decoration-none">Sign In</a>
          </div>
        </form>

      </div>
    </div>
  </main>

  <!-- Standalone Minimal Footer -->
  <footer class="auth-standalone-footer">
    <div class="container">
      &copy; 2026 Aura Finishes &amp; Co. &bull; Secure Encrypted Client Portal
    </div>
  </footer>

  <!-- Bootstrap 5 JS Bundle & Main Script -->
  <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
